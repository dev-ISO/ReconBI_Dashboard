services:
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8000:3000"  # Maps host port 8000 to container port 3000.
    environment:
      - PORT=3000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
